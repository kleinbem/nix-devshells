name: Check Flake

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kleinbem/actions/nix-setup@246758d75c0022f02b964febfba7c5105b17f0a4 # v1.3.2
        with:
          nix-path: nixpkgs=channel:nixos-unstable
          # Read-only Attic over NetBird; skipped when the secrets are
          # absent (fork PRs, Dependabot).
          netbird-setup-key: ${{ secrets.NETBIRD_SETUP_KEY_EPHEMERAL }}
          attic-token: ${{ secrets.ATTIC_PULL_TOKEN }}
      - run: nix flake check
      - run: nix fmt -- --fail-on-change
